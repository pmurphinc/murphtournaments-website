name: Validate Breach Runner Domain PR

on:
  push:
    branches: [chore/breach-runner-arcade-link-domain]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/breach-runner-arcade-link-domain
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Navigation and OAuth tests
        run: pnpm exec vitest run client/src/components/Navigation.test.ts client/src/lib/discordOAuthReturnPath.test.ts
      - name: Arcade score tests
        run: pnpm exec vitest run --config vitest.server.config.ts server/arcadeScores.test.ts
      - name: Record successful validation
        run: |
          mkdir -p .validation
          printf 'typecheck=passed\nnavigation_oauth_tests=passed\narcade_score_tests=passed\n' > .validation/breach-runner-domain.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .validation/breach-runner-domain.txt
          git commit -m "Record Breach Runner domain validation"
          git push origin HEAD:chore/breach-runner-arcade-link-domain
